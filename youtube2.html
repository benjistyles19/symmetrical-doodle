<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube - Broadcast Yourself.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f1f1f1;
  color: #333;
  font: 12px Arial, sans-serif;
}

a {
  color: #167ac6;
  text-decoration: none;
}

a:hover { text-decoration: underline; }

header {
  display: flex;
  align-items: center;
  gap: 25px;
  padding: 12px max(calc((100% - 1120px)/2), 18px);
  background: linear-gradient(white, #f5f5f5);
  border-bottom: 1px solid #ddd;
}

.logo img {
  width: 150px;
  height: auto;
  display: block;
}

form {
  display: flex;
  width: 550px;
  max-width: 100%;
  height: 29px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 5px;
  border: 1px solid #bbb;
  font-size: 14px;
}

button {
  border: 1px solid #bbb;
  background: linear-gradient(white, #e5e5e5);
  padding: 0 15px;
  cursor: pointer;
}

main {
  max-width: 1120px;
  margin: 20px auto;
  padding: 0 10px;
}

h2 {
  font-size: 16px;
  font-weight: normal;
  border-bottom: 1px solid #ddd;
  padding-bottom: 12px;
}

.videos {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px 13px;
}

.video { min-width: 0; }

.thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #bbb;
  border: 1px solid #ccc;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.duration {
  position: absolute;
  right: 4px;
  bottom: 4px;
  background: #111;
  color: white;
  padding: 3px 4px;
}

.vtitle {
  display: block;
  margin-top: 6px;
  font-weight: bold;
  line-height: 1.4;
}

.meta {
  color: #777;
  line-height: 1.6;
  margin-top: 3px;
}

footer {
  border-top: 1px solid #ccc;
  color: #888;
  margin-top: 30px;
  padding: 15px 0;
}

@media (max-width: 750px) {
  .videos { grid-template-columns: repeat(2, 1fr); }
  header { gap: 12px; padding: 12px; }
  .logo img { width: 120px; }
  main { margin-top: 10px; }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="#">
    <img src="youtube2logo.png" alt="YouTube">
  </a>

  <form id="search">
    <input id="query" placeholder="Search videos...">
    <button>Search</button>
  </form>
</header>

<main>
  <h2>Popular on YouTube</h2>

  <div class="videos" id="videos">

    <article class="video" data-search="youtube 2 two introduction welcome">
      <a href="video1.html">
        <div class="thumb">
          <img src="crashman.jpg" alt="Minecraft gameplay">
          <span class="duration">999</span>
        </div>
        <span class="vtitle">WELCOME TO YOUTUBE 2...</span>
      </a>
      <div class="meta">Youtube 2<br>1 views · forever days ago</div>
    </article>

    <article class="video" data-search="me at the zoo two poo">
      <a href="video2.html">
        <div class="thumb">
          <img src="meatpoo.jpg" alt="me at the poo">
          <span class="duration">999</span>
        </div>
        <span class="vtitle">Me at the poo...</span>
      </a>
      <div class="meta">jawes<br>2 TRILLION VIEWS · 2 days ago</div>
    </article>
  </div>

  <footer>
    About · Press · Copyright · Creators · Advertise · Developers
    <p>YOUTUBE 2!, LLC · Broadcast Yourself™</p>
  </footer>
</main>


<script>
document.getElementById("search").addEventListener("submit", function(e) {
  e.preventDefault();

  const query = document.getElementById("query").value.trim().toLowerCase();

  if (query === "codes") {
    window.location.href = "codes.html";
    return;
  }

  document.querySelectorAll(".video").forEach(video => {
    video.hidden = !(
      video.innerText + video.dataset.search
    ).toLowerCase().includes(query);
  });
});
</script>

</body>
</html>
