<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>???</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f1f1f1;
  color: #333;
  font: 12px Arial, sans-serif;
}

a {
  color: #167ac6;
  text-decoration: none;
}

a:hover { text-decoration: underline; }

header {
  display: flex;
  align-items: center;
  gap: 25px;
  padding: 12px max(calc((100% - 1120px)/2), 18px);
  background: linear-gradient(white, #f5f5f5);
  border-bottom: 1px solid #ddd;
}

.logo img {
  width: 150px;
  height: auto;
  display: block;
}

main {
  max-width: 1120px;
  margin: 25px auto;
  padding: 0 10px;
}

h1 {
  font-size: 20px;
  font-weight: normal;
  border-bottom: 1px solid #ddd;
  padding-bottom: 12px;
}

.panel {
  background: white;
  border: 1px solid #ddd;
  padding: 20px;
  max-width: 500px;
}

input {
  width: 100%;
  padding: 8px;
  border: 1px solid #bbb;
  font-size: 14px;
  margin: 8px 0;
}

button {
  border: 1px solid #bbb;
  background: linear-gradient(white, #e5e5e5);
  padding: 7px 15px;
  cursor: pointer;
}

#result {
  margin-top: 15px;
  font-weight: bold;
}

footer {
  border-top: 1px solid #ccc;
  color: #888;
  margin-top: 30px;
  padding: 15px 0;
}

@media (max-width: 750px) {
  header { padding: 12px; }
  .logo img { width: 120px; }
  main { margin-top: 10px; }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="youtube2.html">
    <img src="youtube2logo.png" alt="YouTube 2">
  </a>
</header>

<main>
  <h1>YouTube 2 Cheat Codes</h1>

  <div class="panel">
    <p>Enter a cheat code below to unlock exclusive content!</p>

    <form id="code-form">
      <input id="code-input" placeholder="Enter code..." autocomplete="off">
      <button type="submit">Submit Code</button>
    </form>

    <p id="result"></p>
  </div>

  <footer>
    About · Press · Copyright · Creators · Advertise · Developers
    <p>YOUTUBE 2!, LLC · Broadcast Yourself™</p>
  </footer>
</main>

<script src="codes.js"></script>
<script>
document.getElementById("code-form").addEventListener("submit", function(e) {
  e.preventDefault();

  const message = activateCode(
    document.getElementById("code-input").value
  );

  document.getElementById("result").textContent = message;
});
</script>

</body>
</html>
